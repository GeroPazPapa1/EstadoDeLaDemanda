<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reporte semanal de Canales de contactos - Estado de la Demanda">
  <title>Canales de Contactos - Estado de la Demanda</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
  <div class="dashboard-container">
    <div class="header-banner">
      <span class="header-title-main">Canales de contactos</span>
      <span class="logo-ba">BA</span>
    </div>
    <div class="header-subbanner">ANÁLISIS SEMANAL</div>

    <div class="content">
      <div class="content-top">
        <div>
          <h1 class="main-title">Estado de la Demanda</h1>
          <p class="subtitle" id="subtitulo">Cargando datos...</p>
        </div>
        <button type="button" class="print-button" onclick="window.print()">Imprimir</button>
      </div>

      <div class="kpi-row" id="kpiRow">
        <div class="kpi-card main-kpi">
          <div class="kpi-value" id="kpiTotal">—</div>
          <div class="kpi-label">Demanda Total</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpiSeContacta">—</div>
          <div class="kpi-label" id="kpiSeContactaLabel">Se contacta</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpiNoSeContacta">—</div>
          <div class="kpi-label" id="kpiNoSeContactaLabel">No se contacta</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpiSinCubrir">—</div>
          <div class="kpi-label" id="kpiSinCubrirLabel">Sin cubrir</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-value" id="kpiDesestimado">—</div>
          <div class="kpi-label" id="kpiDesestimadoLabel">Desestimado</div>
        </div>
      </div>

      <div class="columns-grid" id="columnasZonas"></div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>

</html>
